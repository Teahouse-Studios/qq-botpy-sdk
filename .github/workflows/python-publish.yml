name: Publish Python package

on:
  release:
    types: [published]

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/qq-botpy-sdk/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          RELEASE_VERSION="${RELEASE_TAG#v}"
          if [ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match pyproject.toml version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build source and wheel distributions
        run: python -m build --sdist --wheel

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload distributions as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: qq-botpy-sdk-${{ github.event.release.tag_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
