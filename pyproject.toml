[project]
name = "qq-botpy-sdk"
version = "2.0.0"
description = "Community-maintained async Python SDK for the QQ Bot Open Platform"
authors = [{ name = "Teahouse Studios" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<4.0"
dependencies = [
    "aiohttp>=3.14.3,<4",
    "APScheduler>=3.11.3,<4",
    "cryptography>=50.0.0,<51",
    "PyYAML>=6.0.3,<7",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/Teahouse-Studios/qq-botpy-sdk"
Repository = "https://github.com/Teahouse-Studios/qq-botpy-sdk"
Issues = "https://github.com/Teahouse-Studios/qq-botpy-sdk/issues"

[tool.poetry]
packages = [{ include = "botpy" }]

[tool.poetry.group.dev.dependencies]
pre-commit = { version = "^4.6.1", python = ">=3.10" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
