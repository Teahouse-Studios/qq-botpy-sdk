[project]
name = "qq-botpy-sdk"
version = "2.0.6"
description = "Community-maintained async Python SDK for the QQ Bot Open Platform"
authors = [{ name = "Teahouse Studios" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<4.0"
dependencies = [
    "httpx>=0.28.1,<1",
    "httpx-ws>=0.7.2,<1",
    "APScheduler>=3.11.3,<4",
    "cryptography>=50.0.0,<51",
    "PyYAML>=6.0.3,<7",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/Teahouse-Studios/qq-botpy-sdk"
Repository = "https://github.com/Teahouse-Studios/qq-botpy-sdk"
Issues = "https://github.com/Teahouse-Studios/qq-botpy-sdk/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1,<5",
]

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "botpy"
module-root = ""
